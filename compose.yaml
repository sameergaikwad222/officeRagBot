services:
  api:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      - ollama

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: docker.io/ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  qdrant_data:
  ollama_data: